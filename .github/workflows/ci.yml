name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          # Use the canonical installer so the layout matches what
          # `cyrius deps` and `cyriusly` expect: a per-version tree
          # under ~/.cyrius/versions/$VER/{bin,lib}/, plus
          # ~/.cyrius/current + the ~/.cyrius/{bin,lib} → versions/$VER
          # symlinks. cyrius deps reads stdlib from ~/.cyrius/lib;
          # without the symlinks the stdlib copy fails with
          # "cannot read ./lib/<name>.cyr" for every [deps].stdlib entry.
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep -E '^cyrius[[:space:]]*=' cyrius.cyml | sed -E 's/^cyrius[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf "https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh" \
            | CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Verify toolchain
        run: cyrius --version

      - name: Resolve dependencies
        # `./lib/` is gitignored — `cyrius deps` populates it from
        # the version-pinned snapshot + the [deps.sigil/patra] tags.
        # Must run before any compile step.
        run: cyrius deps

      - name: Verify dep hashes
        # `cyrius.lock` records the hash of each resolved dep; on
        # second-and-later runs `--verify` asserts the bytes on
        # disk match. First push of a fresh dep precedes the
        # lockfile by one commit, so we soft-skip if missing.
        run: |
          if [ -f cyrius.lock ]; then
            cyrius deps --verify
          else
            echo "::warning::cyrius.lock not committed — skipping hash verification"
          fi

      - name: Manifest completeness ([lib] modules ⊇ main.cyr includes)
        run: |
          # Every `include "src/<file>.cyr"` in src/main.cyr must be listed in
          # cyrius.cyml [lib] modules. Otherwise `cyrius distlib` silently ships
          # a bundle missing the module, and the dist-freshness gate can't see
          # it because its input (the manifest) is itself the stale oracle.
          # See docs/audit/2026-04-19-audit-2.0.md Finding 1.
          #
          # Includes inside #ifdef ... #endif blocks are excluded — they're
          # opt-in build paths (e.g. src/tpm_anchor.cyr behind LIBRO_TPM)
          # that intentionally stay out of the default dist bundle.
          INCLUDES=$(awk '
            /^#ifdef/ { in_ifdef = 1; next }
            /^#endif/ { in_ifdef = 0; next }
            !in_ifdef && /include "src\/[^"]+\.cyr"/ {
              match($0, /"src\/[^"]+\.cyr"/); print substr($0, RSTART+1, RLENGTH-2)
            }
          ' src/main.cyr | sort -u)
          MANIFEST=$(awk '/^\[lib\]/{flag=1;next} /^\[/{flag=0} flag' cyrius.cyml \
            | grep -oE '"src/[^"]+\.cyr"' | tr -d '"' | sort -u)
          MISSING=$(comm -23 <(echo "$INCLUDES") <(echo "$MANIFEST"))
          EXTRA=$(comm -13 <(echo "$INCLUDES") <(echo "$MANIFEST"))
          if [ -n "$MISSING" ]; then
            echo "FAIL: src/ files included from main.cyr but not in cyrius.cyml [lib] modules:"
            echo "$MISSING"
            echo "Add them under [lib] modules so cyrius distlib bundles them into dist/libro.cyr."
            exit 1
          fi
          if [ -n "$EXTRA" ]; then
            echo "FAIL: files in [lib] modules but not included from main.cyr:"
            echo "$EXTRA"
            echo "Remove them from [lib] modules or include them from src/main.cyr."
            exit 1
          fi
          echo "Manifest covers all main.cyr src/ includes."

      - name: Raw-offset allowlist (per-file registered params)
        run: |
          # Complementary to the specific-struct guard below: every raw
          # `load64(X + N)` / `store64(X + N, …)` / `load64(X)` site in
          # src/*.cyr must use a parameter name registered for that file
          # in the allowlist below. A NEW raw-offset site on an
          # unregistered name fails CI — forcing the author to either
          # (a) switch to a derived accessor, or (b) explicitly opt
          # into the allowlist with review.
          #
          # The allowlist is a snapshot of 2.0.3's legitimate raw-offset
          # sites (structs accessed inside their defining file + a few
          # local-buffer cases). Any addition here should be justified
          # by a comment in the edited source file.
          declare -A ALLOW
          ALLOW[src/anchoring.cyr]="a r _hf_lebuf"
          ALLOW[src/chain.cyr]="a c"
          ALLOW[src/entry.cyr]="e _ts_buf"
          ALLOW[src/error.cyr]="e"
          ALLOW[src/export.cyr]="sb"
          ALLOW[src/file_store.cyr]="e s"
          ALLOW[src/hasher.cyr]="h _hf_lebuf"
          # main.cyr: test locals. *_layout names are intentional
          # raw-offset probes in the #derive(accessors) layout-invariant
          # tests (test_layout_* — see ADR 0005). Added per-struct as
          # the test battery expanded in 2.0.4+.
          # *_layout locals are intentional raw-offset probes in the
          # test_layout_* battery (#derive(accessors) layout invariants —
          # see ADR 0005). Every layout test adds its sentinel-name here.
          # 2.6.1 added 16 (15 default + 1 TPM-gated): archive / error /
          # integrity / review / receipt / memstore / stream / ts_request
          # (tsreq_layout) / ts_response (tsresp_layout) / ts_attestation
          # (tsa_layout) / retention (ret_layout) / proof_node (pn_layout) /
          # merkle_proof (mp_layout) / consistency / pv / tpm_anchor
          # (ta_layout).
          ALLOW[src/main.cyr]="a c e e1 ip probe1 probe2 chain_layout iproof_layout anchor_layout entry_layout sk_layout vk_layout es_layout mt_layout sth_layout fs_layout archive_layout error_layout integrity_layout review_layout receipt_layout memstore_layout stream_layout tsreq_layout tsresp_layout tsa_layout ret_layout pn_layout mp_layout consistency_layout pv_layout ta_layout"
          ALLOW[src/merkle.cyr]="cp mp pn t tree"
          ALLOW[src/patra_store.cyr]="e s"
          ALLOW[src/proof.cyr]="ip p pv s"
          ALLOW[src/query.cyr]="q"
          ALLOW[src/retention.cyr]="r"
          ALLOW[src/review.cyr]="r s"
          ALLOW[src/signing.cyr]="es sk vk"
          ALLOW[src/store.cyr]="s"
          ALLOW[src/streaming.cyr]="entries s sub"
          ALLOW[src/timestamping.cyr]="a r resp"
          # 2.5.0: tpm_anchor is defined in tpm_anchor.cyr and built
          # in tpm_anchor_new via raw offsets at the construction
          # site. `ta` is the canonical tpm_anchor pointer param.
          ALLOW[src/tpm_anchor.cyr]="ta"
          # Files not listed default to empty allowlist (consumers only).
          FAILED=0
          for f in src/*.cyr; do
            hits=$(grep -nE '(load64|store64)\([a-zA-Z_][a-zA-Z0-9_]*(\s*\+\s*[0-9]+)?' "$f" 2>/dev/null || true)
            [ -z "$hits" ] && continue
            allowed="${ALLOW[$f]:-}"
            while IFS= read -r line; do
              pname=$(echo "$line" \
                | grep -oE '(load64|store64)\([a-zA-Z_][a-zA-Z0-9_]*' \
                | head -1 \
                | sed -E 's/(load64|store64)\(//')
              # Skip the rare store64(<literal>, ...) pattern — not applicable here.
              [ -z "$pname" ] && continue
              ok=0
              for a in $allowed; do
                [ "$pname" = "$a" ] && { ok=1; break; }
              done
              if [ "$ok" -eq 0 ]; then
                echo "FAIL in $f: raw-offset on unregistered param '$pname'"
                echo "  $line"
                echo "  → either switch to a derived accessor (preferred) or add '$pname'"
                echo "    to the allowlist for $f with a comment justifying it."
                FAILED=1
              fi
            done <<< "$hits"
          done
          if [ "$FAILED" -ne 0 ]; then exit 1; fi
          echo "Raw-offset allowlist: clean (all sites use registered params)."

      - name: Raw-offset guard (derived structs outside defining files)
        run: |
          # Cross-module readers must use derived accessors on #derive(accessors)
          # structs — not raw `load64(X + N)` / `store64(X + N, …)` / `load64(X)`.
          # We codify one rule per (struct, defining_file, param_name) triple where
          # the param name is unambiguous across libro. See
          # docs/audit/2026-04-19-audit-2.0.md Finding 2 and 2.0.1 release.
          #
          # Adding a new struct rule: pick a param name used only for that struct
          # anywhere in src/, otherwise false positives from shared letters.
          FAILED=0
          check_struct() {
            local struct="$1" defining="$2" param="$3"
            local hits
            hits=$(grep -nE "load64\($param \+ [0-9]+\)|store64\($param \+ [0-9]+|load64\($param\)" src/*.cyr 2>/dev/null \
              | grep -v "^$defining:" || true)
            if [ -n "$hits" ]; then
              echo "FAIL: raw-offset reads/writes on struct $struct outside $defining (param '$param'):"
              echo "$hits"
              echo "  → use the $struct""_* derived accessors (getters + _set_ setters)."
              FAILED=1
            fi
          }
          # struct         | defining file        | canonical param name
          check_struct chain          src/chain.cyr        c
          check_struct iproof         src/proof.cyr        ip
          check_struct signing_key    src/signing.cyr      sk
          check_struct verifying_key  src/signing.cyr      vk
          check_struct entry_sig      src/signing.cyr      es
          check_struct merkle_proof   src/merkle.cyr       mp
          check_struct consistency    src/merkle.cyr       cp
          # 2.6.2: six more derived structs whose canonical param names
          # are unambiguous across libro (don't appear in any other
          # file's raw-offset sites — verified by grep across src/*.cyr
          # for the registered name + offset pattern).
          check_struct pv             src/proof.cyr        pv
          check_struct proof_node     src/merkle.cyr       pn
          check_struct merkle_tree    src/merkle.cyr       tree
          check_struct ts_response    src/timestamping.cyr resp
          check_struct _sub           src/streaming.cyr    sub
          check_struct tpm_anchor     src/tpm_anchor.cyr   ta
          if [ "$FAILED" -ne 0 ]; then exit 1; fi
          echo "No raw-offset struct reads outside defining files."

      - name: Raw-offset bound check (struct field-count enforcement)
        run: |
          # 2.6.2 expansion: for structs whose canonical param name is
          # AMBIGUOUS across libro (single letters `a`, `e`, `r`, `s`
          # shared across multiple defining files), the cross-file
          # specific-struct guard above can't distinguish them. This
          # check fills the gap by validating that raw-offset sites
          # inside each defining file stay within the registered struct's
          # field count. Catches off-by-one bugs after a struct shrinks
          # and stale offsets that miss the new struct boundary.
          #
          # Per (file, param, struct, field_count) — max_offset is
          # computed as (field_count - 1) * 8. The check passes when
          # every `load64(param + N)` / `store64(param + N, …)` site
          # in `file` has N ≤ max_offset for that param's struct.
          #
          # Adding a new entry: pick a (file, param, struct,
          # field_count) tuple from the #derive(accessors) struct
          # declarations. Update on struct field-count change.
          FAILED=0
          check_offset_bound() {
            local file="$1" param="$2" struct="$3" field_count="$4"
            local max_offset=$(( (field_count - 1) * 8 ))
            local hits
            hits=$(grep -nE "(load64|store64)\($param[ ]*\+[ ]*[0-9]+" "$file" 2>/dev/null || true)
            [ -z "$hits" ] && return 0
            while IFS= read -r line; do
              local offset
              offset=$(echo "$line" | grep -oE "\+[ ]*[0-9]+" | head -1 | grep -oE "[0-9]+")
              [ -z "$offset" ] && continue
              if [ "$offset" -gt "$max_offset" ]; then
                echo "FAIL in $file: offset +$offset on param '$param' exceeds struct '$struct' (${field_count} fields → max +$max_offset):"
                echo "  $line"
                echo "  → check the offset, the struct field count, or whether this should use the $struct""_* derived accessors."
                FAILED=1
              fi
            done <<< "$hits"
          }
          # file                       | param | struct          | fields
          check_offset_bound src/anchoring.cyr     a      anchor           9
          check_offset_bound src/anchoring.cyr     r      receipt          5
          check_offset_bound src/chain.cyr         a      archive          2
          check_offset_bound src/entry.cyr         e      entry           11
          check_offset_bound src/error.cyr         e      error            6
          check_offset_bound src/file_store.cyr    e      entry           11
          check_offset_bound src/file_store.cyr    s      filestore        3
          check_offset_bound src/patra_store.cyr   e      entry           11
          check_offset_bound src/patra_store.cyr   s      _patrastore      4
          check_offset_bound src/proof.cyr         s      sth              6
          check_offset_bound src/retention.cyr     r      retention        2
          check_offset_bound src/review.cyr        r      review           9
          check_offset_bound src/review.cyr        s      integrity        2
          check_offset_bound src/store.cyr         s      memstore         1
          check_offset_bound src/streaming.cyr     s      stream           3
          check_offset_bound src/timestamping.cyr  a      ts_attestation   6
          check_offset_bound src/timestamping.cyr  r      ts_request       4
          if [ "$FAILED" -ne 0 ]; then exit 1; fi
          echo "Raw-offset bound check: all sites within their struct field range."

      - name: Format check
        run: cyrfmt --check src/*.cyr

      - name: Lint
        run: |
          for f in src/*.cyr; do
            cyrius lint "$f" || true
          done

      - name: Build (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/libro
          echo "libro: $(wc -c < build/libro) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/libro | grep -q "7f45 4c46"

      - name: Test suite
        run: |
          ./build/libro > /tmp/libro_test_out 2>&1 || true
          cat /tmp/libro_test_out | tr -d '\0'
          grep -q "0 failed" /tmp/libro_test_out || { echo "FAIL: tests did not report 0 failed"; exit 1; }
          echo "PASS: all tests"

      - name: TPM-opt-in build + test (LIBRO_TPM)
        # 2.5.0 ships src/tpm_anchor.cyr behind -D LIBRO_TPM. Default
        # builds (above) don't include it. This step verifies the
        # opt-in compiles clean against agnosys's tpm_seal/tpm_unseal
        # surface and the TPM-tests pass under "no TPM device" or
        # "TPM device but no tpm2-tools" (the typical CI shape) —
        # both code paths are explicitly exercised by the test fns.
        run: |
          CYRIUS_DCE=1 cyrius build -D LIBRO_TPM src/main.cyr build/libro_tpm
          ./build/libro_tpm > /tmp/libro_tpm_test_out 2>&1 || true
          cat /tmp/libro_tpm_test_out | tr -d '\0'
          grep -q "0 failed" /tmp/libro_tpm_test_out || {
            echo "FAIL: LIBRO_TPM build tests did not report 0 failed"; exit 1; }
          echo "PASS: LIBRO_TPM build + tests"

      - name: Fuzz
        run: |
          for f in fuzz/*.fcyr; do
            name=$(basename "$f" .fcyr)
            CYRIUS_DCE=1 cyrius build "$f" "build/$name"
            timeout 10 "build/$name" || { echo "FUZZ CRASH: $name"; exit 1; }
            echo "  $name: ok"
          done

      - name: Benchmarks
        env:
          # Append one CSV row per bench to bench-history.csv, tagged
          # with the commit SHA so successive runs form a perf trend.
          # bench_history_write() is a no-op when LIBRO_BENCH_HISTORY
          # is unset, so this has zero overhead for local runs.
          LIBRO_BENCH_HISTORY: ${{ github.workspace }}/bench-history.csv
          LIBRO_BENCH_TAG: ${{ github.sha }}
        run: |
          for f in benches/*.bcyr; do
            name=$(basename "$f" .bcyr)
            CYRIUS_DCE=1 cyrius build "$f" "build/$name"
            "build/$name"
          done
          if [ -f "$LIBRO_BENCH_HISTORY" ]; then
            echo "=== bench history rows this run ==="
            tail -n +1 "$LIBRO_BENCH_HISTORY" | head -40
            echo "==="
          fi

      - name: Upload bench history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-history-${{ github.sha }}
          path: bench-history.csv
          if-no-files-found: ignore
          retention-days: 90

      - name: dist/libro.cyr is up-to-date
        run: |
          cyrius distlib || true  # self-compile check fails on external-dep refs (sigil); bundle still emitted
          test -s dist/libro.cyr || { echo "FAIL: dist/libro.cyr not produced"; exit 1; }
          if ! git diff --exit-code dist/libro.cyr; then
            echo "FAIL: dist/libro.cyr is stale. Run 'cyrius distlib' locally and commit."
            exit 1
          fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for dangerous patterns
        run: |
          WARN=0
          if grep -rn 'syscall(59' src/ 2>/dev/null | grep -v "# " | grep -v kernel_audit; then
            echo "WARN: raw execve in libro modules"; WARN=1
          fi
          if grep -rn '"/etc/' src/ 2>/dev/null; then
            echo "WARN: hardcoded /etc paths"; WARN=1
          fi
          echo "security scan complete (warnings: $WARN)"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs
        run: |
          MISSING=0
          for doc in README.md CHANGELOG.md CLAUDE.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md LICENSE VERSION cyrius.cyml; do
            if [ -f "$doc" ]; then echo "  OK: $doc"; else echo "  MISSING: $doc"; MISSING=1; fi
          done
          exit $MISSING
      - name: Verify version consistency
        run: |
          # cyrius.cyml uses ${file:VERSION} interpolation, so VERSION
          # is the single source of truth. Assert the interpolation
          # literal is present (so cyrius resolves it correctly) and
          # the VERSION value appears in CHANGELOG.
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          grep -q '^version = "\${file:VERSION}"' cyrius.cyml || {
            echo "FAIL: cyrius.cyml version must be \${file:VERSION}"; exit 1; }
          grep -q "\[$FILE_VERSION\]" CHANGELOG.md || {
            echo "FAIL: version $FILE_VERSION not in CHANGELOG.md"; exit 1; }
          echo "Version consistent: $FILE_VERSION (VERSION → cyrius.cyml via \${file:VERSION})"
