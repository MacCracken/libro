name: Release

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_VERSION=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG="${GITHUB_REF_NAME}"
          [ "$FILE_VERSION" = "$TAG" ] || { echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          [ "$CYML_VERSION" = "$TAG" ] || { echo "cyrius.cyml ($CYML_VERSION) != tag ($TAG)"; exit 1; }

      - name: Install Cyrius toolchain
        run: |
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep -E '^cyrius[[:space:]]*=' cyrius.cyml | sed -E 's/^cyrius[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sLO "https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          tar xzf "cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/bin" "$HOME/.cyrius/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/bin/" 2>/dev/null || true
          cp "$CYRIUS_DIR/scripts/cyrius" "$HOME/.cyrius/bin/cyrius" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/lib/" 2>/dev/null || true
          chmod +x "$HOME/.cyrius/bin/"* 2>/dev/null || true
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Build (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/libro
          echo "libro: $(wc -c < build/libro) bytes"

      - name: Smoke test
        run: |
          ./build/libro > /tmp/libro_out 2>&1 || true
          grep -q "0 failed" /tmp/libro_out || { echo "FAIL: tests did not report 0 failed"; exit 1; }

      - name: Regenerate dist/libro.cyr (consumer distribution artifact)
        run: |
          cyrius distlib || true  # self-compile check fails on external-dep refs (sigil); bundle still emitted
          test -s dist/libro.cyr || { echo "FAIL: dist/libro.cyr not produced"; exit 1; }
          echo "dist/libro.cyr: $(wc -l < dist/libro.cyr) lines, $(wc -c < dist/libro.cyr) bytes"

      - name: Verify dist/libro.cyr matches committed copy
        run: |
          if ! git diff --exit-code dist/libro.cyr; then
            echo "FAIL: committed dist/libro.cyr is stale. Run 'cyrius distlib' and commit."
            exit 1
          fi

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          rm -f cyrius-*.tar.gz
          git archive --format=tar.gz --prefix="libro-${TAG}/" -o "libro-${TAG}-src.tar.gz" HEAD
          cp dist/libro.cyr "libro-${TAG}.cyr"
          sha256sum libro-*.tar.gz libro-*.cyr build/libro > SHA256SUMS

      - name: Extract changelog
        run: |
          awk "/^## \\[${GITHUB_REF_NAME}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md

      - uses: softprops/action-gh-release@v2
        with:
          name: "libro ${{ github.ref_name }}"
          body_path: /tmp/body.md
          prerelease: ${{ startsWith(github.ref_name, '0.') }}
          files: |
            libro-*.tar.gz
            libro-*.cyr
            build/libro
            SHA256SUMS
