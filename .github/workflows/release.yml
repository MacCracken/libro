name: Release

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          # cyrius.cyml uses ${file:VERSION} interpolation, so VERSION
          # is the single source of truth. Assert tag == VERSION and
          # the manifest carries the interpolation literal.
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG="${GITHUB_REF_NAME}"
          [ "$FILE_VERSION" = "$TAG" ] || {
            echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          grep -q '^version = "\${file:VERSION}"' cyrius.cyml || {
            echo "cyrius.cyml version must be \${file:VERSION}"; exit 1; }
          echo "Version verified: $TAG (cyrius.cyml pulls from VERSION via \${file:VERSION})"

      - name: Install Cyrius toolchain
        run: |
          # Canonical installer (see ci.yml for rationale).
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep -E '^cyrius[[:space:]]*=' cyrius.cyml | sed -E 's/^cyrius[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf "https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh" \
            | CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Verify toolchain
        run: cyrius --version

      - name: Resolve dependencies
        run: cyrius deps

      - name: Verify dep hashes
        # cyrius 6.0.1's `cyrius deps` clobbers the working-tree
        # cyrius.lock to "0 deps locked" (empty) on every run, so
        # `cyrius deps --verify` reads the empty file and fails. Verify
        # the resolved lib/ bytes against the COMMITTED lock from git
        # instead. Mirrors ci.yml — see the long note there.
        run: |
          if ! git show HEAD:cyrius.lock > /tmp/committed.lock 2>/dev/null \
             || [ ! -s /tmp/committed.lock ]; then
            echo "::warning::committed cyrius.lock missing or empty — skipping hash verification"
            exit 0
          fi
          sha256sum -c /tmp/committed.lock

      - name: Build (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/libro
          echo "libro: $(wc -c < build/libro) bytes"

      - name: Smoke test
        run: |
          ./build/libro > /tmp/libro_out 2>&1 || true
          grep -q "0 failed" /tmp/libro_out || { echo "FAIL: tests did not report 0 failed"; exit 1; }

      - name: Regenerate dist/libro.cyr (consumer distribution artifact)
        run: |
          cyrius distlib || true  # self-compile check fails on external-dep refs (sigil); bundle still emitted
          test -s dist/libro.cyr || { echo "FAIL: dist/libro.cyr not produced"; exit 1; }
          echo "dist/libro.cyr: $(wc -l < dist/libro.cyr) lines, $(wc -c < dist/libro.cyr) bytes"

      - name: Verify dist/libro.cyr matches committed copy
        run: |
          if ! git diff --exit-code dist/libro.cyr; then
            echo "FAIL: committed dist/libro.cyr is stale. Run 'cyrius distlib' and commit."
            exit 1
          fi

      - name: Clean toolchain artifacts
        run: rm -f cyrius-*.tar.gz

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          # cyrius deps/build/distlib above all clobber the working-tree
          # cyrius.lock to 0 bytes under 6.0.1. Restore the committed
          # lock so the shipped asset (and its SHA256SUMS entry) is the
          # real pinned lock, not an empty file.
          git checkout HEAD -- cyrius.lock
          git archive --format=tar.gz --prefix="libro-${TAG}/" -o "libro-${TAG}-src.tar.gz" HEAD
          cp dist/libro.cyr "libro-${TAG}.cyr"
          sha256sum libro-*.tar.gz libro-*.cyr build/libro cyrius.lock > SHA256SUMS

      - name: Extract changelog
        run: |
          awk "/^## \\[${GITHUB_REF_NAME}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md

      - uses: softprops/action-gh-release@v2
        with:
          name: "libro ${{ github.ref_name }}"
          body_path: /tmp/body.md
          prerelease: ${{ startsWith(github.ref_name, '0.') }}
          files: |
            libro-*.tar.gz
            libro-*.cyr
            build/libro
            cyrius.lock
            SHA256SUMS
